<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Semi Circle: Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="app" aria-live="polite"><p class="boot">Loading…</p></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script>
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName && e.target.tagName !== 'SCRIPT') return; // a font or icon failing is harmless
  var a = document.getElementById('app');
  if (a && /Loading/.test(a.textContent)) a.textContent = 'The admin page could not start: ' + (e.message || ('could not load ' + ((e.target && (e.target.src || e.target.href)) || 'a file'))) + '. Try a hard refresh (Ctrl+Shift+R).';
}, true);
</script>
<script src="/admin/admin.js"></script>
</body>
</html>
