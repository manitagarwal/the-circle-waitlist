<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Application Status — The Semi Circle</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e0f; --bg-2:#141516; --panel:#17181a; --panel-border:#2a2b2c;
    --ink:#ece7dd; --ink-dim:#9a9186; --ink-dimmer:#6c655c;
    --accent:#b6935e; --accent-soft:rgba(182,147,94,0.14);
    --good:#8fae7a; --error:#c97b6a;
    --serif:'Fraunces', serif; --sans:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .wrap{max-width:480px; margin:0 auto; padding:0 24px;}

  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 24px; border-bottom:1px solid var(--panel-border);
  }
  .nav-brand{display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:1.02rem; color:var(--ink);}
  .nav-brand svg{width:18px; height:14px; flex-shrink:0;}
  .nav-brand i{font-style:italic; font-weight:400;}
  .back-link{
    color:var(--ink-dim); font-size:0.82rem; text-decoration:none;
    border:1px solid var(--panel-border); padding:9px 16px; border-radius:2px;
  }
  .back-link:hover{border-color:var(--accent); color:var(--accent);}

  main{padding:60px 24px 100px; min-height:70vh; display:flex; align-items:center;}
  .status-head{text-align:center; margin-bottom:36px;}
  .status-head h1{font-family:var(--serif); font-weight:400; font-size:1.9rem; margin:0 0 10px;}
  .status-head p{color:var(--ink-dim); margin:0; font-size:0.98rem;}

  .card{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:4px; padding:36px 32px; width:100%;
  }
  label{display:block; font-size:0.85rem; color:var(--ink-dim); margin-bottom:8px;}
  .inline-btn-field{display:flex; gap:10px;}
  input{
    flex:1; background:var(--bg-2); border:1px solid var(--panel-border); color:var(--ink);
    padding:13px 14px; font-family:var(--sans); font-size:1rem; border-radius:2px;
    text-transform:uppercase; transition:border-color .2s;
  }
  input:focus{border-color:var(--accent); outline:none;}
  button{font-family:var(--sans); cursor:pointer;}
  .btn{
    background:var(--accent); color:#1a1610; border:none; padding:13px 22px;
    font-size:0.92rem; font-weight:500; border-radius:2px; transition:opacity .2s;
  }
  .btn:hover{opacity:0.9;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .status-result{
    margin-top:22px; padding-top:22px; border-top:1px solid var(--panel-border);
    font-size:0.95rem; color:var(--ink-dim); display:none;
  }
  .status-result.show{display:block;}
  .status-result .name{color:var(--ink); font-weight:500; font-size:1.1rem; margin-bottom:8px;}
  .status-badge{
    display:inline-block; padding:5px 12px; font-size:0.82rem;
    border-radius:2px; background:var(--accent-soft); color:var(--accent);
  }
  .status-badge.rejected{background:rgba(201,123,106,0.14); color:var(--error);}
  .status-badge.accepted{background:rgba(143,174,122,0.14); color:var(--good);}
  .err-text{color:var(--error);}

  .tracker{display:flex; margin-top:18px; gap:8px;}
  .tracker .step{flex:1; text-align:center;}
  .tracker .dot{
    width:10px; height:10px; border-radius:50%; margin:0 auto 8px;
    background:var(--panel-border);
  }
  .tracker .step.done .dot{background:var(--accent);}
  .tracker .step.rejected .dot{background:var(--error);}
  .tracker .step.accepted .dot{background:var(--good);}
  .tracker .label{font-size:0.66rem; color:var(--ink-dimmer); text-transform:uppercase; letter-spacing:0.03em;}
  .tracker .step.done .label, .tracker .step.rejected .label, .tracker .step.accepted .label{color:var(--ink-dim);}

  footer{
    padding:40px 24px 60px; text-align:center; color:var(--ink-dimmer);
    font-size:0.82rem; border-top:1px solid var(--panel-border);
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M4,20 A16,16 0 0 1 36,20 L4,20 Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    The Semi <i>Circle</i>
  </div>
  <a class="back-link" href="index.html">Back home</a>
</nav>

<main>
  <div class="wrap">
    <div class="status-head">
      <h1>Check your application</h1>
      <p>Enter the Application ID you were given when you applied.</p>
    </div>

    <div class="card">
      <label for="statusInput">Application ID</label>
      <div class="inline-btn-field">
        <input type="text" id="statusInput" placeholder="e.g. 8K3PLQ" autocomplete="off">
        <button type="button" class="btn" id="statusCheckBtn">Check</button>
      </div>
      <div class="status-result" id="statusResult"></div>
    </div>
  </div>
</main>

<footer>The Semi Circle — currently in private beta.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://qjtuahvhszxektzdmmdf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqdHVhaHZoc3p4ZWt0emRtbWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzkzNDUsImV4cCI6MjEwNTc1NTM0NX0.Blt9FzDgZq_BgoraEraJVZwMcIEtZh7oXkrNWm-N-aQ';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STATUS_LABELS = {
    pending: 'Submitted',
    shortlisted: 'Under Review',
    accepted: 'Accepted',
    rejected: 'Rejected'
  };
  const STATUS_STEP = { pending: 0, shortlisted: 1, accepted: 2, rejected: 2 };

  const statusInput = document.getElementById('statusInput');
  const statusResult = document.getElementById('statusResult');
  const btn = document.getElementById('statusCheckBtn');

  async function checkStatus(){
    const code = statusInput.value.trim().toUpperCase();
    if(!code) return;

    btn.disabled = true;
    btn.textContent = 'Checking…';

    const { data, error } = await sb.rpc('check_application_status', { p_code: code });

    btn.disabled = false;
    btn.textContent = 'Check';

    statusResult.classList.add('show');
    if(error || !data || !data.length){
      statusResult.innerHTML = `<span class="err-text">Never heard of them. Double-check the code.</span>`;
      return;
    }

    const row = data[0];
    const label = STATUS_LABELS[row.status] || row.status;
    const step = STATUS_STEP[row.status] ?? 0;
    const badgeClass = row.status === 'rejected' ? 'rejected' : (row.status === 'accepted' ? 'accepted' : '');

    const stageNames = ['Application Submitted', 'Under Review', row.status === 'rejected' ? 'Rejected' : 'Accepted'];
    const tracker = stageNames.map((name, i) => {
      let cls = '';
      if(row.status === 'rejected' && i === 2) cls = 'rejected';
      else if(row.status === 'accepted' && i === 2) cls = 'accepted';
      else if(i <= step) cls = 'done';
      return `<div class="step ${cls}"><div class="dot"></div><div class="label">${name}</div></div>`;
    }).join('');

    statusResult.innerHTML = `
      <div class="name">${row.full_name || 'Applicant'}</div>
      <div class="status-badge ${badgeClass}">${label}</div>
      <div class="tracker">${tracker}</div>
    `;
  }

  btn.addEventListener('click', checkStatus);
  statusInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkStatus();
  });
})();
</script>

</body>
</html>
