<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Avatar 03">
<style>
.bob{animation:bob 3.2s ease-in-out 0.8s infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s 0.8s infinite}
